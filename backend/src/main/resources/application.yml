spring:
  application:
    name: slotsync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotsync}
    username: ${DB_USER:slotsync}
    password: ${DB_PASSWORD:slotsync}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

slotsync:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-value-in-production-min-32-bytes}
    access-ttl-ms: 900000
    refresh-ttl-days: 7

logging:
  level:
    com.slotsync: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
